    <circle cx="130" cy="24" r="10" fill="#8ad2ff" />
    <circle cx="102" cy="110" r="10" fill="#2e7de0" />
    <circle cx="158" cy="110" r="10" fill="#2e7de0" />
    <rect x="98" y="136" width="64" height="8" rx="4" fill="#5ba9ff" />
